name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://arc-options-2fa45de1.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate Django application
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
          python manage.py test --exclude-tag=browser

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Promote the accepted staging artifact
        env:
          RESOURCE_GROUP: rg-optionsdjango-centralindia
          STAGING_APP: arc-options-staging-2fa45de1
          PRODUCTION_APP: arc-options-2fa45de1
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/promote_appservice_artifact.sh

      - name: Warm and verify the deployed web application
        run: |
          base_url="https://arc-options-2fa45de1.azurewebsites.net"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 \
              "${base_url}/deployment-health/" --output /tmp/deployment-health.json &&
              jq --exit-status --arg sha "${{ github.sha }}" \
                '.status == "ok" and .commit == $sha' /tmp/deployment-health.json &&
              curl --fail --silent --show-error --max-time 20 \
              "${base_url}/admin/login/" --output /tmp/login.html &&
              curl --fail --silent --show-error --max-time 20 \
              "${base_url}/static/options_tracker/radar_workspace.css" \
              --output /tmp/radar-workspace.css; then
              echo "Deployment warm-up passed for ${{ github.sha }} on attempt ${attempt}."
              exit 0
            fi
            echo "Warm-up attempt ${attempt} failed; retrying in 15 seconds."
            sleep 15
          done
          echo "::error::Deployment completed but the expected commit and web/static warm-up did not pass."
          exit 1