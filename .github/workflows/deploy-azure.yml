name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://arc-options-2fa45de1.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate Django application
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
          python manage.py test --exclude-tag=browser

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stamp the commit into the package
        # Oryx builds the runtime into output.tar.zst and excludes unknown
        # root-level files. Stamp a Python module so the running application can
        # publish the exact commit after migrations succeed; the trading VM
        # follows that database marker rather than origin/master.
        run: printf 'DEPLOYED_SHA = "%s"\n' "${{ github.sha }}" > options_tracker/deployed_sha.py

      - name: Trim the deployment package
        # research/ is two hundred scripts and their output. The site reads
        # sixteen small CSVs from it, and those now live in
        # options_tracker/data/research/ and travel with the app. Shipping the
        # rest lengthens every deploy and puts half-finished experiments on the
        # production host for no reason.
        run: rm -rf research

      - name: Deploy to Azure
        # The Azure CLI rather than azure/webapps-deploy@v3, which started
        # answering "Failed to deploy web package using OneDeploy to App
        # Service. Forbidden (CODE: 403)" on 24 August against an unchanged
        # subscription: same Website Contributor assignment (13 August, and it
        # deployed fine on the 19th), no IP restrictions, plan Ready, usage
        # Normal, nothing in the activity log. What did change is the runner --
        # azure/login@v2 is now force-migrated to Node 24 -- and the deploy
        # action's only credential is state handed to it by that login step.
        # `az` uses the login's own session, so there is no handoff to lose, and
        # when it does fail it says which call was refused.
        run: |
          zip -qr /tmp/package.zip . -x '.git/*'
          previous_deployment_id=""
          for attempt in $(seq 1 8); do
            previous_deployment_id="$(az webapp log deployment list \
              --resource-group rg-optionsdjango-centralindia \
              --name arc-options-2fa45de1 \
              --query '[0].id' --output tsv 2>/dev/null)"
            [ -n "$previous_deployment_id" ] && break
            echo "Kudu history unavailable before deployment; retrying in 15 seconds."
            sleep 15
          done
          if [ -z "$previous_deployment_id" ]; then
            echo "::error::Could not establish the previous Kudu deployment ID; refusing an ambiguous deploy."
            exit 1
          fi

          set +e
          : > /tmp/deploy.log
          deployment_started=false
          for initiation_attempt in $(seq 1 3); do
            az webapp deploy \
              --resource-group rg-optionsdjango-centralindia \
              --name arc-options-2fa45de1 \
              --src-path /tmp/package.zip --type zip \
              --async true --track-status false >> /tmp/deploy.log 2>&1
            code=$?
            [ $code -eq 0 ] && break

            for discovery_attempt in $(seq 1 8); do
              latest_id="$(az webapp log deployment list \
                --resource-group rg-optionsdjango-centralindia \
                --name arc-options-2fa45de1 \
                --query '[0].id' --output tsv 2>/dev/null)"
              if [ -n "$latest_id" ] && [ "$latest_id" != "$previous_deployment_id" ]; then
                deployment_started=true
                break
              fi
              sleep 15
            done
            [ "$deployment_started" = "true" ] && break
            echo "Deployment initiation attempt $initiation_attempt created no Kudu deployment; retrying."
          done
          cat /tmp/deploy.log
          # Upload asynchronously so the runner does not disappear inside the
          # CLI's synchronous status tracker. A successful upload is not a
          # successful deployment: require a new Kudu ID to reach status 4.
          code=1
          if [ $code -ne 0 ]; then
            terminal_failures=0
            for attempt in $(seq 1 80); do
              deployment="$(az webapp log deployment list \
                --resource-group rg-optionsdjango-centralindia \
                --name arc-options-2fa45de1 \
                --query '[0]' \
                --output json)"
              deployment_id="$(jq -r '.id // ""' <<< "$deployment")"
              deployment_status="$(jq -r '.status // ""' <<< "$deployment")"
              deployment_complete="$(jq -r '.complete // false' <<< "$deployment")"
              deployment_progress="$(jq -r '.progress // ""' <<< "$deployment")"
              echo "Kudu attempt $attempt: id=$deployment_id status=$deployment_status complete=$deployment_complete progress=$deployment_progress"
              if [ -z "$deployment_id" ] || [ "$deployment_id" = "$previous_deployment_id" ]; then
                echo "Waiting for a new Kudu deployment ID; refusing to reuse $previous_deployment_id."
                sleep 15
                continue
              fi
              if [ "$deployment_complete" = "true" ] || [ "$deployment_complete" = "True" ]; then
                if [ "$deployment_status" = "4" ]; then
                  code=0
                  break
                fi
                terminal_failures=$((terminal_failures + 1))
                if [ "$terminal_failures" -ge 3 ]; then
                  break
                fi
                echo "Kudu reported terminal status $deployment_status; allowing a short stabilization window."
              else
                terminal_failures=0
              fi
              sleep 15
            done
          fi
          # Lift the failure into an annotation as well as the log. Run logs need
          # an authenticated GitHub session to read; annotations do not, so this
          # is the difference between diagnosing a failed deploy and guessing at
          # one -- which cost three runs when the action's bare 403 was all there
          # was to go on.
          if [ $code -ne 0 ]; then
            echo "::error::az webapp deploy exited $code: $(tail -c 800 /tmp/deploy.log | tr '\n\r' '  ')"
            exit $code
          fi

      - name: Warm and verify the deployed web application
        run: |
          base_url="https://arc-options-2fa45de1.azurewebsites.net"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 20 \
              "${base_url}/admin/login/" --output /tmp/login.html &&
              curl --fail --silent --show-error --max-time 20 \
              "${base_url}/static/options_tracker/radar_workspace.css" \
              --output /tmp/radar-workspace.css; then
              echo "Deployment warm-up passed on attempt ${attempt}."
              exit 0
            fi
            echo "Warm-up attempt ${attempt} failed; retrying in 15 seconds."
            sleep 15
          done
          echo "::error::Deployment completed but web/static warm-up did not pass."
          exit 1