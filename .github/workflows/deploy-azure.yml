name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://arc-options-2fa45de1.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Django application
        run: |
          python manage.py check
          python manage.py test

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stamp the commit into the package
        # App Service unpacks a zip with no .git in it, so this file is the only
        # way it can know which commit it is serving. `record_deployment` reads
        # it on startup and publishes it; the trading VM follows that row rather
        # than origin/master, so it never runs code whose migration has not been
        # applied yet. See options_tracker/deployment.py.
        run: echo "${{ github.sha }}" > DEPLOYED_SHA

      - name: Trim the deployment package
        # research/ is two hundred scripts and their output. The site reads
        # sixteen small CSVs from it, and those now live in
        # options_tracker/data/research/ and travel with the app. Shipping the
        # rest lengthens every deploy and puts half-finished experiments on the
        # production host for no reason.
        run: rm -rf research

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: arc-options-2fa45de1
          package: .